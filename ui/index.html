<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRAMDISK</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="app-name">VRAMDISK</span>
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </header>

    <main class="app">
      <!-- ============ Setup screen (nothing mounted) ============ -->
      <section id="screen-setup" class="screen">
        <form id="mount-form" autocomplete="off">
          <div class="field">
            <label for="device" data-i18n="device">GPU</label>
            <select id="device" required></select>
          </div>

          <div class="field">
            <label data-i18n="target">マウント先</label>
            <div class="seg" role="tablist">
              <button type="button" class="seg-btn active" data-mount-mode="drive" data-i18n="driveLetter">ドライブレター</button>
              <button type="button" class="seg-btn" data-mount-mode="folder" data-i18n="folder">フォルダ</button>
            </div>
            <div id="mount-drive-field">
              <select id="drive" required></select>
            </div>
            <div id="mount-folder-field" hidden>
              <div class="row">
                <input id="mount-folder" type="text" placeholder="C:\vramdisk" spellcheck="false" />
                <button id="browse-folder-btn" type="button" class="btn" data-i18n="browse">参照...</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="size-value" data-i18n="capacity">容量</label>
            <div class="row size-row">
              <input id="size-value" type="number" min="0" step="any" inputmode="decimal" />
              <select id="size-unit">
                <option value="MB">MB</option>
                <option value="GB" selected>GB</option>
              </select>
            </div>
            <div id="size-error" class="hint error" hidden></div>
          </div>

          <div class="field">
            <label data-i18n="options">オプション</label>
            <div class="check-col">
              <label class="check"><input id="compress" type="checkbox" /> <span data-i18n="compressOpt">データを圧縮（nvCOMP / GPU）</span></label>
              <label class="check"><input id="dedup" type="checkbox" /> <span data-i18n="dedupOpt">同一内容のチャンクを共有</span></label>
            </div>
            <div id="compress-hint" class="hint" hidden data-i18n="compressHint">
              nvCOMP が見つからないため、この GUI では圧縮を利用できません（CLI では CPU zstd にフォールバックします）
            </div>
          </div>

          <button id="mount-btn" type="submit" class="btn btn-primary btn-block" data-i18n="mount">マウント</button>
          <div id="setup-status" class="status-text" role="status"></div>
        </form>
      </section>

      <!-- ============ Mounted screen ============ -->
      <section id="screen-mounted" class="screen" hidden>
        <div class="mounted-head">
          <div class="drive-letter" id="mounted-drive">R:</div>
          <div class="mounted-sub" id="mounted-sub"></div>
        </div>

        <div class="usage-bar" aria-hidden="true"><div class="usage-fill" id="usage-fill"></div></div>
        <div class="usage-text">
          <span id="usage-text-left">— / —</span>
          <span id="usage-text-pct">0.0%</span>
        </div>

        <div class="stat-list">
          <div class="stat-row"><span class="k" data-i18n="statFiles">ファイル数</span><span class="v" id="stat-files">—</span></div>
          <div class="stat-row"><span class="k" data-i18n="statLogical">論理データ</span><span class="v" id="stat-logical">—</span></div>
          <div class="stat-row"><span class="k" data-i18n="statDedup">共有による節約</span><span class="v" id="stat-dedup">—</span></div>
          <div class="stat-row"><span class="k" data-i18n="statPacked">圧縮による節約</span><span class="v" id="stat-compress">—</span></div>
        </div>

        <div class="field">
          <label data-i18n="toolsLabel">マウント中のファイルを GPU で処理</label>
          <div class="tool-col">
            <button id="open-hash" type="button" class="tool-btn">
              <span class="tool-name" data-i18n="toolHash">ハッシュ計算</span><span class="tool-desc">MD5 / SHA-1 / SHA-256</span>
            </button>
            <button id="open-archive" type="button" class="tool-btn">
              <span class="tool-name" data-i18n="toolArchive">圧縮・展開</span><span class="tool-desc">tar.zst / tar.gz / zip</span>
            </button>
            <button id="open-search" type="button" class="tool-btn">
              <span class="tool-name" data-i18n="toolSearch">全文検索</span><span class="tool-desc" data-i18n="toolSearchDesc">ドライブ全体を横断</span>
            </button>
            <button id="open-encode" type="button" class="tool-btn">
              <span class="tool-name" data-i18n="toolEncode">エンコード</span><span class="tool-desc">Base64 / hex</span>
            </button>
          </div>
        </div>

        <button id="unmount-btn" type="button" class="btn btn-block" data-i18n="unmount">アンマウント</button>
        <div id="mounted-status" class="status-text" role="status"></div>
      </section>

      <!-- ============ Hash panel ============ -->
      <section id="screen-hash" class="screen" hidden>
        <div class="panel-head">
          <button type="button" class="btn-back" data-back data-i18n="back">← 戻る</button>
          <h2 data-i18n="toolHash">ハッシュ計算</h2>
        </div>
        <form id="hash-form" autocomplete="off">
          <div class="field">
            <label for="hash-path" data-i18n="hashPath">対象（ファイル / フォルダ）</label>
            <div class="row">
              <input id="hash-path" type="text" value="\" spellcheck="false" />
              <button id="hash-path-browse" type="button" class="btn" data-i18n="browse">参照...</button>
            </div>
          </div>
          <div class="row">
            <div class="field grow">
              <label for="hash-algo" data-i18n="algorithm">アルゴリズム</label>
              <select id="hash-algo">
                <option value="sha256">SHA-256</option>
                <option value="sha1">SHA-1</option>
                <option value="md5">MD5</option>
                <option value="fnv1a64">FNV-1a 64</option>
              </select>
            </div>
            <label class="check check-inline"><input id="hash-recursive" type="checkbox" checked /> <span data-i18n="recursive">サブフォルダも含める</span></label>
          </div>
          <button id="hash-btn" type="submit" class="btn btn-primary btn-block" data-i18n="hashRun">計算する</button>
          <div class="job-row" id="hash-job-row" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span class="status-text" id="hash-status" role="status"></span>
            <button type="button" class="btn" id="hash-cancel" data-i18n="cancel">中止</button>
          </div>
          <div class="job-progress" id="hash-progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-label="progressLabel">
            <div class="job-progress-bar"><div class="job-progress-fill" id="hash-progress-fill"></div></div>
            <div class="job-progress-text">
              <span id="hash-progress-bytes"></span>
              <span class="job-progress-eta" id="hash-progress-eta"></span>
              <span id="hash-progress-pct"></span>
            </div>
          </div>
          <div id="hash-done" class="status-text" role="status"></div>
        </form>
        <div id="hash-result" class="kv-list"></div>
      </section>

      <!-- ============ Archive panel ============ -->
      <section id="screen-archive" class="screen" hidden>
        <div class="panel-head">
          <button type="button" class="btn-back" data-back data-i18n="back">← 戻る</button>
          <h2 data-i18n="toolArchive">圧縮・展開</h2>
        </div>

        <div class="seg" role="tablist">
          <button type="button" class="seg-btn active" data-mode="compress" data-i18n="compressTab">圧縮</button>
          <button type="button" class="seg-btn" data-mode="extract" data-i18n="extractTab">展開</button>
        </div>

        <form id="archive-form" autocomplete="off">
          <div id="archive-compress-fields">
            <div class="field">
              <label for="archive-paths" data-i18n="archiveSource">対象（フォルダは常に再帰）</label>
              <div class="row">
                <input id="archive-paths" type="text" spellcheck="false" />
                <button id="archive-paths-browse" type="button" class="btn" data-i18n="browse">参照...</button>
              </div>
            </div>
            <div class="field">
              <label for="archive-output" data-i18n="archiveOutput">出力先アーカイブ</label>
              <div class="row">
                <input id="archive-output" type="text" spellcheck="false" />
                <button id="archive-output-browse" type="button" class="btn" data-i18n="browse">参照...</button>
              </div>
            </div>
            <div class="field">
              <label for="archive-format" data-i18n="format">形式</label>
              <select id="archive-format">
                <option value="tar.zst" data-i18n="formatZst">tar.zst（推奨・高速）</option>
                <option value="tar.lz4">tar.lz4</option>
                <option value="tar.gz">tar.gz</option>
                <option value="zip">zip</option>
              </select>
            </div>
          </div>

          <div id="archive-extract-fields" hidden>
            <div class="field">
              <label for="archive-input" data-i18n="archiveInput">展開するアーカイブ</label>
              <div class="row">
                <input id="archive-input" type="text" spellcheck="false" />
                <button id="archive-input-browse" type="button" class="btn" data-i18n="browse">参照...</button>
              </div>
            </div>
            <div class="field">
              <label for="archive-outdir" data-i18n="archiveOutdir">展開先フォルダ</label>
              <div class="row">
                <input id="archive-outdir" type="text" spellcheck="false" />
                <button id="archive-outdir-browse" type="button" class="btn" data-i18n="browse">参照...</button>
              </div>
            </div>
          </div>

          <button id="archive-btn" type="submit" class="btn btn-primary btn-block">圧縮を実行</button>
          <div class="job-row" id="archive-job-row" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span class="status-text" id="archive-status" role="status"></span>
            <button type="button" class="btn" id="archive-cancel" data-i18n="cancel">中止</button>
          </div>
          <div class="job-progress" id="archive-progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-label="progressLabel">
            <div class="job-progress-bar"><div class="job-progress-fill" id="archive-progress-fill"></div></div>
            <div class="job-progress-text">
              <span id="archive-progress-bytes"></span>
              <span class="job-progress-eta" id="archive-progress-eta"></span>
              <span id="archive-progress-pct"></span>
            </div>
          </div>
          <div id="archive-done" class="status-text" role="status"></div>
        </form>
        <div id="archive-result" class="kv-list"></div>
      </section>

      <!-- ============ Encode panel ============ -->
      <section id="screen-encode" class="screen" hidden>
        <div class="panel-head">
          <button type="button" class="btn-back" data-back data-i18n="back">← 戻る</button>
          <h2 data-i18n="toolEncode">エンコード</h2>
        </div>

        <div class="seg" role="tablist">
          <button type="button" class="seg-btn active" data-direction="encode" data-i18n="encodeTab">エンコード</button>
          <button type="button" class="seg-btn" data-direction="decode" data-i18n="decodeTab">デコード</button>
        </div>

        <form id="encode-form" autocomplete="off">
          <div class="field">
            <label for="encode-codec" data-i18n="codec">形式</label>
            <select id="encode-codec">
              <option value="base64">Base64</option>
              <option value="hex" data-i18n="hexOption">hex（16進テキスト）</option>
            </select>
          </div>
          <div class="field">
            <label for="encode-input" data-i18n="encodeInput">変換するファイル</label>
            <div class="row">
              <input id="encode-input" type="text" spellcheck="false" />
              <button id="encode-input-browse" type="button" class="btn" data-i18n="browse">参照...</button>
            </div>
          </div>
          <div class="field">
            <label for="encode-output" data-i18n="encodeOutput">出力ファイル</label>
            <div class="row">
              <input id="encode-output" type="text" spellcheck="false" />
              <button id="encode-output-browse" type="button" class="btn" data-i18n="browse">参照...</button>
            </div>
          </div>
          <button id="encode-btn" type="submit" class="btn btn-primary btn-block">エンコードを実行</button>
          <div class="job-row" id="encode-job-row" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span class="status-text" id="encode-status" role="status"></span>
            <button type="button" class="btn" id="encode-cancel" data-i18n="cancel">中止</button>
          </div>
          <div class="job-progress" id="encode-progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-label="progressLabel">
            <div class="job-progress-bar"><div class="job-progress-fill" id="encode-progress-fill"></div></div>
            <div class="job-progress-text">
              <span id="encode-progress-bytes"></span>
              <span class="job-progress-eta" id="encode-progress-eta"></span>
              <span id="encode-progress-pct"></span>
            </div>
          </div>
          <div id="encode-done" class="status-text" role="status"></div>
        </form>
        <div id="encode-result" class="kv-list"></div>
      </section>
      <section id="screen-search" class="screen" hidden>
        <div class="panel-head">
          <button type="button" class="btn-back" data-back data-i18n="back">← 戻る</button>
          <h2 data-i18n="toolSearch">全文検索</h2>
        </div>

        <form id="search-form" autocomplete="off">
          <div class="field">
            <label for="search-pattern" data-i18n="searchPattern">検索する文字列</label>
            <input id="search-pattern" type="text" spellcheck="false" />
          </div>
          <div class="field">
            <label for="search-path" data-i18n="searchScope">対象（ファイル / フォルダ）</label>
            <div class="row">
              <input id="search-path" type="text" spellcheck="false" />
              <button id="search-path-browse" type="button" class="btn" data-i18n="browse">参照...</button>
            </div>
          </div>
          <div class="field">
            <label class="check"><input id="search-ignore-case" type="checkbox" /> <span data-i18n="searchIgnoreCase">大文字小文字を区別しない</span></label>
          </div>
          <button id="search-btn" type="submit" class="btn btn-primary btn-block" data-i18n="searchRun">検索する</button>
          <div class="job-row" id="search-job-row" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span class="status-text" id="search-status" role="status"></span>
            <button type="button" class="btn" id="search-cancel" data-i18n="cancel">中止</button>
          </div>
          <div class="job-progress" id="search-progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-label="progressLabel">
            <div class="job-progress-bar"><div class="job-progress-fill" id="search-progress-fill"></div></div>
            <div class="job-progress-text">
              <span id="search-progress-bytes"></span>
              <span class="job-progress-eta" id="search-progress-eta"></span>
              <span id="search-progress-pct"></span>
            </div>
          </div>
          <div id="search-done" class="status-text" role="status"></div>
        </form>
        <div id="search-result" class="kv-list"></div>
      </section>
    </main>

    <!-- ============ Teardown prompt (unmount / quit) ============
         Three outcomes — save to ZIP first, tear down anyway, cancel — so it
         cannot be a native message dialog (those top out at two buttons). The
         tray drives it through the "request-teardown" event. -->
    <div id="teardown-backdrop" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="teardown-title">
        <h2 id="teardown-title"></h2>
        <p id="teardown-body" class="modal-body"></p>

        <div class="modal-actions" id="teardown-actions">
          <button id="teardown-save" type="button" class="btn btn-primary btn-block"></button>
          <button id="teardown-discard" type="button" class="btn btn-block"></button>
          <button id="teardown-cancel" type="button" class="btn btn-block"></button>
        </div>

        <div class="job-row" id="export-job-row" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span class="status-text" id="export-status" role="status"></span>
          <button type="button" class="btn" id="export-cancel" data-i18n="cancel">中止</button>
        </div>
        <div class="job-progress" id="export-progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-label="progressLabel">
          <div class="job-progress-bar"><div class="job-progress-fill" id="export-progress-fill"></div></div>
          <div class="job-progress-text">
            <span id="export-progress-bytes"></span>
            <span class="job-progress-eta" id="export-progress-eta"></span>
            <span id="export-progress-pct"></span>
          </div>
        </div>
        <div id="export-done" class="status-text" role="status"></div>
        <div id="export-failures" class="kv-list"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
