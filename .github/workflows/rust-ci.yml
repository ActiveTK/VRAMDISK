name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core build and tests (no GPU required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run GPU-free tests
        run: cargo test --no-default-features --locked

  windows-exe:
    name: Build Windows executable
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --yes --no-progress

      - name: Install WinFsp SDK and runtime
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WinFsp installer failed with exit code $($process.ExitCode)" }
          $env:LIBCLANG_PATH = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) { throw 'libclang.dll was not installed' }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$env:LIBCLANG_PATH"

      - name: Extract WinSpd Developer SDK
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winspd-1.0.20357.msi'
          $target = Join-Path $env:RUNNER_TEMP 'winspd-sdk'
          Invoke-WebRequest 'https://github.com/winfsp/winspd/releases/download/v1.0B1/winspd-1.0.20357.msi' -OutFile $msi
          New-Item -ItemType Directory -Path $target | Out-Null
          $process = Start-Process msiexec.exe -ArgumentList @('/a', $msi, '/qn', "TARGETDIR=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WinSpd SDK extraction failed with exit code $($process.ExitCode)" }
          $header = Get-ChildItem -LiteralPath $target -Filter 'winspd.h' -Recurse | Select-Object -First 1
          if (-not $header) { throw 'WinSpd developer headers were not found in the extracted MSI' }
          $sdk = $header.Directory.Parent.Parent.FullName
          Add-Content -Path $env:GITHUB_ENV -Value "WINSPD_SDK_DIR=$sdk"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release executable
        shell: pwsh
        run: .\build-gui.ps1 build --features winspd

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: vramdisk-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/vramdisk.exe
          if-no-files-found: error
          retention-days: 14
